name: Update GitHub Analytics Assets

on:
  schedule:
    - cron: "17 4 * * *"

  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - "scripts/**"
      - "assets/**"
      - ".github/workflows/update-pr-review-chart.yml"

permissions:
  contents: write

jobs:
  update-assets:
    name: Generate analytics SVGs
    runs-on: ubuntu-latest
    # Prevent recursive loops: skip commits made by the Actions bot
    if: github.actor != 'github-actions[bot]'
    env:
      PROFILE_ANALYTICS_TOKEN: ${{ secrets.PROFILE_ANALYTICS_TOKEN }}

    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Note analytics token scope
        run: |
          if [ -z "$PROFILE_ANALYTICS_TOKEN" ]; then
            echo "::notice::PROFILE_ANALYTICS_TOKEN is not configured; falling back to GITHUB_TOKEN, so organization/private analytics may be incomplete."
          fi

      - name: Generate PR and review chart
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_LOGIN: azizullahaziz
        run: node scripts/generate-pr-review-chart.mjs

      - name: Generate GitHub stats SVGs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_LOGIN: azizullahaziz
        run: node scripts/generate-github-stats.mjs

      - name: Verify generated SVGs contain real data
        run: |
          fail=0
          for svg in assets/pr-review-chart.svg assets/github-overview.svg assets/github-streak.svg assets/github-top-languages.svg; do
            if [ ! -s "$svg" ]; then
              echo "ERROR: $svg is empty"
              fail=1
            fi
            if grep -qE '(—|Updating automatically|Chart data will appear)' "$svg"; then
              echo "ERROR: $svg contains placeholder content"
              fail=1
            fi
          done
          # Verify pr-review-chart has the expected month-axis label group (stable id)
          if ! grep -q 'id="prc-title"' assets/pr-review-chart.svg; then
            echo "ERROR: pr-review-chart.svg missing expected title element"
            fail=1
          fi
          # Verify PR/review chart has values or explicit diagnostics
          if ! grep -qE 'PRs [0-9]+|Submitted reviews [0-9]+|Diagnostics:' assets/pr-review-chart.svg; then
            echo "ERROR: pr-review-chart.svg has no values or diagnostics text"
            fail=1
          fi
          # Verify top-languages has language values or explicit diagnostics
          if ! grep -qE '[0-9]+\.[0-9]+%|No language bytes found|Diagnostics:' assets/github-top-languages.svg; then
            echo "ERROR: github-top-languages.svg has no language values or diagnostics"
            fail=1
          fi
          if [ $fail -ne 0 ]; then exit 1; fi
          echo "All SVG verification checks passed."

      - name: Commit updated assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/pr-review-chart.svg \
                  assets/github-overview.svg \
                  assets/github-streak.svg \
                  assets/github-top-languages.svg

          if git diff --cached --quiet; then
            echo "No asset changes detected."
            exit 0
          fi

          git commit -m "chore: update github analytics assets [skip ci]"
          git push
